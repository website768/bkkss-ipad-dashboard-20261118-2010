<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>iPad Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Arial;background:#0f0f1a;color:#e0e0e0;padding:12px}
h1{font-size:1.2em;margin-bottom:8px}
.status-bar{background:#1a1a2e;padding:6px 12px;border-radius:6px;margin-bottom:10px;font-size:0.85em;color:#86efac}
.controls{background:#1a1a2e;padding:8px 12px;border-radius:6px;margin-bottom:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.controls select{background:#252540;color:#fff;border:1px solid #444;padding:4px 8px;border-radius:4px}
.controls button{background:#333;color:#fff;border:1px solid #555;padding:4px 12px;border-radius:4px;cursor:pointer}
.controls button.active{background:#1e40af}
.mode{font-weight:bold;padding:4px 12px;border-radius:4px}
.mode-offline{background:#7f1d1d;color:#fca5a5}
.mode-online{background:#14532d;color:#86efac}
.mode-all{background:#1e3a5f;color:#93c5fd}
.on{color:#4ade80}.off{color:#f87171}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.group{background:#1a1a2e;border-radius:6px;min-width:280px;flex:1}
.header{display:flex;align-items:center;padding:6px 8px;background:#252540;border-radius:6px 6px 0 0}
.header h3{flex:1;font-size:0.9em}
.body{padding:6px 8px;overflow-y:auto;max-height:500px}
.item{font-size:0.78em;padding:2px 0;display:flex;gap:6px;align-items:center;cursor:pointer}
.item:hover{background:#252540}
.item .name{flex:1}
.item .loc{color:#7dd3fc;min-width:70px}
.item .date{min-width:60px;text-align:center;padding:1px 4px;border-radius:3px;font-size:0.85em}
.date-today{background:#14532d;color:#86efac}
.date-never{background:#1c1917;color:#78716c}
.notes-panel{position:fixed;right:10px;top:10px;width:300px;max-width:90vw;background:#1a1a2e;border:1px solid #444;border-radius:6px;padding:12px;display:none;z-index:100}
.notes-panel textarea{width:100%;height:140px;background:#252540;color:#fff;border:1px solid #555;border-radius:4px;padding:8px;margin:8px 0}
.notes-panel button{margin-right:6px;background:#1e40af;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}
.token-box{background:#1a1a2e;padding:10px;border-radius:6px;margin-bottom:10px;font-size:0.85em}
.token-box input{width:100%;padding:6px;background:#252540;color:#fff;border:1px solid #555;border-radius:4px;margin-top:4px}
</style></head><body>
<h1>iPad Dashboard</h1>
<div class="status-bar" id="statusBar">最後檢查：載入中...</div>
<div class="token-box" id="tokenBox" style="display:none">
  GitHub Token（第一次在此裝置輸入）:<br>
  <input type="password" id="tokenInput" placeholder="github_pat_...">
  <button onclick="saveToken()">Save Token</button>
</div>
<div class="controls">
<label>Scan: <select id="scanSelect" onchange="loadScan()"></select></label>
<button id="btnOffline" onclick="setMode('offline')">Offline</button>
<button id="btnOnline" onclick="setMode('online')">Online</button>
<button id="btnAll" onclick="setMode('all')">All Groups</button>
<span class="mode" id="modeLabel">OFFLINE</span>
<span class="on" id="onlineCnt">Online: -</span>
<span class="off" id="offlineCnt">Offline: -</span>
</div>
<div class="grid" id="grid"></div>
<div class="notes-panel" id="notesPanel">
<div id="notesTitle"></div>
<textarea id="notesText" placeholder="備註..."></textarea>
<button onclick="saveNote()">Save to GitHub</button>
<button onclick="closeNotes()">Close</button>
</div>

  if (!ap) return '-';
  const s = ap.replace('M_AP_281013-002_17853669_', '');
  return AP_LOC[s] || s;
}
function getDateClass(dateStr) {
  if (!dateStr || dateStr === 'Never') return 'date-never';
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'/');
  return dateStr === today ? 'date-today' : 'date-never';
}
function formatDate(dateStr) {
  if (!dateStr || dateStr === 'Never') return 'Never';
  return dateStr.slice(5);
}
function sortKey(g) {
  const gl = g.toLowerCase();
  for (let i = 0; i < ORDER.length; i++) if (gl.includes(ORDER[i])) return i;
  return 100;
}

function loadScan() {
  const label = document.getElementById('scanSelect').value;
  const scan = scans[label] || {};
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'/');
  const groups = {};
  for (const [mac, info] of Object.entries(master)) {
    const g = info.group;
    if (!groups[g]) groups[g] = {online: [], offline: []};
    const e = {name: info.name, loc: '', last: '', date: '', mac};
    if (scan[mac]) {
      e.loc = getLoc(scan[mac].ap);
      e.last = scan[mac].last;
      e.date = e.last.slice(0,10);
      if (e.last.startsWith(today)) groups[g].online.push(e);
      else groups[g].offline.push(e);
    } else {
      e.date = 'Never';
      groups[g].offline.push(e);
    }
  }
  const sorted = Object.keys(groups).sort((a,b) => sortKey(a) - sortKey(b));
  let ton = 0, toff = 0;
  sorted.forEach(g => {
    groups[g].online.sort((a,b) => a.name.localeCompare(b.name));
    groups[g].offline.sort((a,b) => (b.date || '').localeCompare(a.date || '') || a.name.localeCompare(b.name));
    ton += groups[g].online.length;
    toff += groups[g].offline.length;
  });
  document.getElementById('onlineCnt').textContent = 'Online: ' + ton;
  document.getElementById('offlineCnt').textContent = 'Offline: ' + toff;
  const modeEl = document.getElementById('modeLabel');
  if (showAll) {
    modeEl.textContent = 'ALL';
    modeEl.className = 'mode mode-all';
  } else {
    modeEl.textContent = showOnline ? 'ONLINE' : 'OFFLINE';
    modeEl.className = 'mode ' + (showOnline ? 'mode-online' : 'mode-offline');
  }
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  sorted.forEach(g => {

    let items = [];
    if (showAll) {
      items = [...d.online, ...d.offline];
    } else {

function openNotes(mac, name) {
  document.getElementById('notesTitle').textContent = name;
  document.getElementById('notesText').value = notes[mac] || '';
  document.getElementById('notesPanel').style.display = 'block';
  document.getElementById('notesPanel').dataset.mac = mac;
}

async function saveNote() {
  const text = document.getElementById('notesText').value.trim();
  const token = getToken();
  if (!token) { alert('請先輸入 Token'); document.getElementById('tokenBox').style.display = 'block'; return; }
  const mac = document.getElementById('notesPanel').dataset.mac;
  if (text) notes[mac] = text;
  else delete notes[mac];
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(notes, null, 2))));
  const url = `https://api.github.com/repos/${REPO}/contents/${NOTES_PATH}`;
  try {
    const getR = await fetch(url, {headers: {'Authorization': 'Bearer ' + token}});
    const sha = getR.ok ? (await getR.json()).sha : null;
    const body = { message: 'Update notes', content };
    if (sha) body.sha = sha;
    const putR = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (putR.ok) { alert('已儲存'); closeNotes(); loadScan(); }
    else alert('失敗');
  } catch(e) { alert(e); }
}

function closeNotes() { document.getElementById('notesPanel').style.display = 'none'; }

}
