<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>iPad Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Arial;background:#0f0f1a;color:#e0e0e0;padding:12px}
h1{font-size:1.1em;margin-bottom:8px}
.controls{background:#1a1a2e;padding:8px 12px;border-radius:6px;margin-bottom:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.controls select, .controls input{background:#252540;color:#fff;border:1px solid #444;padding:4px 8px;border-radius:4px}
.controls input{width:50px;text-align:center}
.controls button{background:#333;color:#fff;border:1px solid #555;padding:4px 12px;border-radius:4px;cursor:pointer}
.controls button:hover{background:#444}
.controls button.paused{background:#7f1d1d}
.mode{font-weight:bold;padding:4px 12px;border-radius:4px}
.mode-offline{background:#7f1d1d;color:#fca5a5}
.mode-online{background:#14532d;color:#86efac}
.on{color:#4ade80}.off{color:#f87171}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.group{background:#1a1a2e;border-radius:6px;min-width:320px;flex:1}
.header{display:flex;align-items:center;padding:6px 8px;background:#252540;border-radius:6px 6px 0 0;cursor:move}
.header h3{flex:1;font-size:0.9em}
.header .cnt{font-size:0.8em;color:#888;margin-right:8px}
.header button{background:none;border:none;color:#666;cursor:pointer;padding:2px 6px;font-size:0.8em}
.header button:hover{color:#fff}
.body{padding:6px 8px;overflow-y:auto;resize:vertical;min-height:60px;max-height:500px}
.item{font-size:0.78em;padding:2px 0;display:flex;gap:6px;align-items:center}
.item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .loc{color:#7dd3fc;min-width:80px;font-size:0.9em}
.item .date{min-width:70px;text-align:center;padding:1px 4px;border-radius:3px;font-size:0.85em}
.item .time{color:#666;min-width:45px;text-align:right}
.offline-item{color:#fca5a5}
.online-item{opacity:0.7}
.dragging{opacity:0.5}
.date-today{background:#14532d;color:#86efac}
.date-1{background:#1e3a5f;color:#93c5fd}
.date-2{background:#3f3f46;color:#d4d4d8}
.date-3{background:#44403c;color:#d6d3d1}
.date-4{background:#422006;color:#fcd34d}
.date-5{background:#431407;color:#fdba74}
.date-old{background:#450a0a;color:#fca5a5}
.date-never{background:#1c1917;color:#78716c}
</style></head><body>
<h1>iPad Dashboard</h1>
<div class="controls">
<label>Scan: <select id="scanSelect" onchange="loadScan()"></select></label>
<label>Interval: <input type="number" id="intervalInput" value="1" min="1" max="60" onchange="updateInterval()">s</label>
<button id="pauseBtn" onclick="togglePause()">Pause</button>
<span class="mode" id="modeLabel">OFFLINE</span>
<span class="on" id="onlineCnt">Online: -</span>
<span class="off" id="offlineCnt">Offline: -</span>
</div>
<div class="grid" id="grid"></div>

function getLoc(ap) {
  if (!ap) return '-';
  const s = ap.replace('M_AP_281013-002_17853669_', '');
  return AP_LOC[s] || s;
}

function getDateClass(dateStr) {
  if (!dateStr || dateStr === 'Never') return 'date-never';
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'/');
  if (dateStr === today) return 'date-today';
  const d = new Date(dateStr.replace(/\//g,'-'));
  const now = new Date();
  const diff = Math.floor((now - d) / (1000*60*60*24));
  if (diff <= 1) return 'date-1';
  if (diff <= 2) return 'date-2';
  if (diff <= 3) return 'date-3';
  if (diff <= 4) return 'date-4';
  if (diff <= 5) return 'date-5';
  return 'date-old';
}

function formatDate(dateStr) {
  if (!dateStr || dateStr === 'Never') return 'Never';
  return dateStr.slice(5);
}

function sortKey(g) {
  const gl = g.toLowerCase();
  for (let i = 0; i < ORDER.length; i++) {
    if (gl.includes(ORDER[i])) return i;
  }
  return 100;
}

function loadScan() {
  const label = document.getElementById('scanSelect').value;
  const scan = scans[label] || {};
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'/');
  
  const groups = {};
  for (const [mac, info] of Object.entries(master)) {
    const g = info.group;
    if (!groups[g]) groups[g] = {online: [], offline: []};
    const e = {name: info.name, loc: '', last: '', date: ''};
    if (scan[mac]) {
      e.loc = getLoc(scan[mac].ap);
      e.last = scan[mac].last;
      e.date = e.last.slice(0,10);
      if (e.last.startsWith(today)) groups[g].online.push(e);
      else groups[g].offline.push(e);
    } else {
      e.date = 'Never';
      groups[g].offline.push(e);
    }
  }
  
  const sorted = Object.keys(groups).sort((a,b) => sortKey(a) - sortKey(b));
  let ton = 0, toff = 0;
  sorted.forEach(g => {
    groups[g].online.sort((a,b) => a.name.localeCompare(b.name));
    groups[g].offline.sort((a,b) => (b.date || '').localeCompare(a.date || '') || a.name.localeCompare(b.name));
    ton += groups[g].online.length;
    toff += groups[g].offline.length;
  });
  
  document.getElementById('onlineCnt').textContent = 'Online: ' + ton;
  document.getElementById('offlineCnt').textContent = 'Offline: ' + toff;
  
  const modeEl = document.getElementById('modeLabel');
  modeEl.textContent = showOnline ? 'ONLINE' : 'OFFLINE';
  modeEl.className = 'mode ' + (showOnline ? 'mode-online' : 'mode-offline');
  
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  sorted.forEach(g => {
    const d = groups[g];
    const items = showOnline ? d.online : d.offline;
    if (items.length === 0) return;
    
    let body = '';
    items.forEach(i => {
      const dateClass = getDateClass(i.date);
      const dateDisplay = formatDate(i.date);
      const timeDisplay = i.last ? i.last.slice(-5) : '-';
      const itemClass = showOnline ? 'online-item' : 'offline-item';
      body += `<div class="item ${itemClass}"><span class="name">${i.name}</span><span class="loc">${i.loc}</span><span class="date ${dateClass}">${dateDisplay}</span><span class="time">${timeDisplay}</span></div>`;
    });
    
    const div = document.createElement('div');
    div.className = 'group';
    div.draggable = true;
    div.innerHTML = `<div class="header"><h3>${g}</h3><span class="cnt">${items.length}</span><button onclick="moveUp(this)">▲</button><button onclick="moveDown(this)">▼</button></div><div class="body" style="height:200px">${body}</div>`;
    grid.appendChild(div);
  });
  setupDrag();
}

function updateInterval() {
  const val = parseInt(document.getElementById('intervalInput').value) || 1;
  intervalSec = Math.max(1, Math.min(60, val));
  document.getElementById('intervalInput').value = intervalSec;
  if (!paused) {
    clearInterval(intervalId);
    startInterval();
  }
}

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pauseBtn');
  if (paused) {
    btn.textContent = 'Resume';
    btn.classList.add('paused');
    if (intervalId) clearInterval(intervalId);
  } else {
    btn.textContent = 'Pause';
    btn.classList.remove('paused');
    startInterval();
  }
}

function startInterval() {
  intervalId = setInterval(() => {
    if (!paused) {
      showOnline = !showOnline;
      loadScan();
    }
  }, intervalSec * 1000);
}

function moveUp(b) { const g=b.closest('.group'), p=g.previousElementSibling; if(p) g.parentNode.insertBefore(g,p); }
function moveDown(b) { const g=b.closest('.group'), n=g.nextElementSibling; if(n) g.parentNode.insertBefore(n,g); }
function setupDrag() {
  document.querySelectorAll('.group').forEach(g => {
    g.ondragstart = e => { g.classList.add('dragging'); e.dataTransfer.setData('text',''); };
    g.ondragend = () => g.classList.remove('dragging');
    g.ondragover = e => { e.preventDefault(); const d=document.querySelector('.dragging'); if(d && d!==g) g.parentNode.insertBefore(d,g); };
  });
}

  opt.textContent = l;
  sel.appendChild(opt);
});
